# SPDX-License-Identifier: AGPL-3.0-or-later
name: i18n Weblate PR

# Weblate pushes translation commits to the defined translations branch
# (see the component's push branch). This workflow opens or refreshes a single
# pull request from that branch into `canary`. Squash-merge it to land all the
# translation updates as one clean commit.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: i18n-weblate-pr
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASE_BRANCH: canary

jobs:
  open-pr:
    name: open or refresh the Weblate PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FLUXER_CI_APP_ID }}
          private-key: ${{ secrets.FLUXER_CI_APP_KEY }}
          owner: fluxerapp
          repositories: flutter_client
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          token: ${{ steps.create-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Open or refresh the translations PR
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "origin/${{ vars.TRANSLATIONS_BRANCH }}" >/dev/null; then
            echo "No ${{ vars.TRANSLATIONS_BRANCH }} branch yet; nothing to do."
            exit 0
          fi
          ahead="$(git rev-list --count "origin/$BASE_BRANCH..origin/${{ vars.TRANSLATIONS_BRANCH }}")"
          if [[ "$ahead" -eq 0 ]]; then
            echo "${{ vars.TRANSLATIONS_BRANCH }} has no commits beyond $BASE_BRANCH; nothing to do."
            exit 0
          fi
          pr="$(gh pr list --base "$BASE_BRANCH" --head "${{ vars.TRANSLATIONS_BRANCH }}" --state open --json number --jq '.[0].number // empty')"
          body=$'Translation updates from Weblate. Squash-merge to land them as a single commit on canary.\n\nWeblate: https://weblate.fluxer.tools/projects/flutter-client/'
          if [[ -z "$pr" ]]; then
            gh pr create --base "$BASE_BRANCH" --head "${{ vars.TRANSLATIONS_BRANCH }}" \
              --title "i18n: update translations from Weblate" --body "$body"
          else
            echo "PR #$pr already open; new commits are reflected automatically."
          fi
