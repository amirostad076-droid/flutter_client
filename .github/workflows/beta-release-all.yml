name: Beta Release (iOS + Android)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-actor:
    name: Check allowed user
    runs-on: ubuntu-latest
    steps:
      - name: Check actor against allowlist
        id: check
        run: |
          ALLOWED="${{ vars.ALLOWED_TESTFLIGHT_ACTORS }}"
          if [ -z "$ALLOWED" ]; then
            echo "::error::Repository variable ALLOWED_TESTFLIGHT_ACTORS is not set. Add a comma-separated list of GitHub usernames in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          ACTOR="${{ github.actor }}"
          ALLOWED_ARR="${ALLOWED//,/ }"
          FOUND=false
          for user_name in $ALLOWED_ARR; do
            user_name_trimmed=$(echo "$user_name" | xargs)
            if [ "$user_name_trimmed" = "$ACTOR" ]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" != "true" ]; then
            echo "::error::User $ACTOR is not allowed to run this workflow. Allowed users are listed in ALLOWED_TESTFLIGHT_ACTORS."
            exit 1
          fi

  trigger-builds:
    name: Trigger ${{ matrix.workflow }}
    needs: check-actor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - ios-beta-testflight.yml
          - android-beta-fcm.yml
          - android-beta-oss.yml
    steps:
      - name: Dispatch workflow
        env:
          GH_TOKEN: ${{ secrets.FLUXER_AUTOMATION_PAT }}
        run: |
          gh workflow run "${{ matrix.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "beta"
