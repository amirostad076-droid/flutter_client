name: Release Drafter Autolabel

on:
  pull_request_target:
    branches:
      - canary
      - beta
      - stable
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    name: Label pull request for release notes
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@693d20e7c1ce1a81d3a41962f85914253b518449
        with:
          config-name: release-drafter-beta.yml
